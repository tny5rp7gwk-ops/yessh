<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TOEIC Vocabulary</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
    <h1>📚 TOEIC Vocabulary</h1>
    <p>효율적으로 외우는 토익 단어장</p>
</header>

<main>

<div class="card" id="card">

    <div id="english" class="front">
        Loading...
    </div>

    <div id="korean" class="back">
        뜻
    </div>

</div>

<div class="buttons">

<button onclick="flipCard()">
뜻 보기
</button>

<button onclick="knowWord()">
😊 알고 있음
</button>

<button onclick="dontKnowWord()">
😵 모르겠음
</button>

</div>

<div class="progress">

<div>
오늘 학습
<span id="count">0</span>
</div>

<div>
남은 단어
<span id="remain">0</span>
</div>

</div>

</main>

<script src="script.js"></script>

</body>
</html>
